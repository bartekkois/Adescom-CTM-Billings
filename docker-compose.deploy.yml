version: '3.5'

services:
  adescomctmbillings:
    image: bartekkois/adescomctmbillings:1.0.7
    restart: always
    volumes:
      - /docker/AdescomCTMBillings/appsettings.json:/app/appsettings.json:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "5001:80"
